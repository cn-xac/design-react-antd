# 发布工作流：@x-ac/web-design-react-antd → npm（可信发布 / OIDC / 免 token）
#
# 触发：
#   - 推送 v* tag（如 v1.0.0）即发布；
#   - 手动 workflow_dispatch 默认 dry_run=true —— 只跑全套门禁 + `publish --dry-run`
#     （除上传 registry 外做尽一切），用来验证工作流本身；要真发版必须显式勾掉 dry_run。
#     tag 触发不受影响：非 dispatch 事件下 inputs.dry_run 为 null → 真 Publish 照跑。
#
# 参考 cn-xac/regex 的 .github/workflows/publish.yml 门禁模式，按本仓布局调整：
#   - 本包是独立适配包，依赖 @x-ac/web-design-core / @x-ac/web-design-react 的已发布版本
#     （^1.0.0，见 package.json 的 devDependencies / peerDependencies），由 npm 直接安装，
#     不再需要 checkout 上游 monorepo 源码。
#   - 本仓库 checkout 到 ext/，所有 run 步骤的 working-directory 都是 ext/，
#     缓存/包管理路径都带 ext/ 前缀。
#
# 可信发布（npm Trusted Publishing，基于 OIDC）：
#   - 不需要任何 npm secret；GitHub Actions 用 OIDC 临时凭证发布并生成 provenance。
#   - registry-url 仅写入指向 npmjs 的 .npmrc（不设 NODE_AUTH_TOKEN → 纯 OIDC）。
#   - npm OIDC 要求 npm >= 11.5.1 → node-version: 24。
#   - 首次发布：可信发布者只能绑定到**已存在的包**，首版必须先手工种一个占位版本
#     （如 0.0.0），再在 npmjs 登记 Trusted Publisher；之后正式版本由本工作流接管。
#   - 登记信息必须与本文件完全一致：
#       owner = cn-xac / repository = web-design-react-antd / Workflow = publish.yml
#     （仓库改名后，须到 npmjs 重新登记 Trusted Publisher 的 repository 字段，
#      并确认 GitHub Settings → Environments 的 `npm` 环境名与工作流一致。）
#     Environment 见下方 `environment: npm`，需与 npmjs 登记的名称、以及
#     GitHub 仓库 Settings → Environments 里的同名环境一致。
#
# 注意：本工作流只负责「安装 + 门禁 + 构建 + 发布」，不建 tag、不 push。
# tag 由开发者本地按约定执行：git tag -s v1.0.0 -m "release 1.0.0" 后推送。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只跑门禁与 publish --dry-run，不上传 registry
        type: boolean
        default: true
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

defaults:
  run:
    working-directory: ext

jobs:
  publish:
    name: Build, test and publish to npm
    runs-on: ubuntu-latest
    # 必须与 npmjs Trusted Publisher 登记的 Environment 名一致；
    # 也要在 GitHub 仓库 Settings → Environments 里建同名环境。
    environment: npm
    steps:
      - name: Checkout extension package
        uses: actions/checkout@v7
        with:
          path: ext
          persist-credentials: false

      # 本仓库 checkout 到 ext/，workspace 根没有 package.json；
      # 显式指向 ext/package.json 读取 packageManager，否则 action-setup 会报缺 version。
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ext/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm
          cache-dependency-path: ext/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 门禁顺序：先 build 再 typecheck/test。引擎依赖由 npm 安装（已发布版本），
      # 不依赖上游源码；仍先产出库产物，让 verify-dist 能硬校验。
      - name: Build library
        run: pnpm build

      # 产物硬校验：脚本写坏时「build 绿 → 发出没有 dist 的空包」，这里改成硬失败。
      - name: Verify build artifacts
        run: node tools/verify-dist.mjs

      - name: Typecheck & test
        run: |
          pnpm typecheck
          pnpm test

      # 版本一致性：tag 后缀必须等于 package.json 的 version，防手滑。
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch 触发，跳过 tag 校验（REF=$GITHUB_REF_NAME）"
            exit 0
          fi
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG version=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG 与 package.json 版本 $VERSION 不一致"
            exit 1
          fi

      # 上传前预览 tarball 清单，避免误把 src / 测试 / lockfile 打进包。
      # --config.ignore-scripts=true：dist 已产出并校验过，跳过 prepack 重复构建
      #（pnpm pack 没有 --ignore-scripts 选项，用通用 config 传入）。
      - name: Preview packed contents
        run: pnpm --config.ignore-scripts=true pack --dry-run

      # 手动触发默认路径：与真发版同一条命令，只多一个 --dry-run。
      # 刻意不带 --provenance —— 来源证明要绑定真实发布，dry-run 下无意义。
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: pnpm publish --access public --no-git-checks --ignore-scripts --dry-run

      # --ignore-scripts：dist 已产出，跳过 prepack 的重复构建，也杜绝发布钩子递归触发 publish。
      # --no-git-checks：本仓工作区含构建产物 dist（未跟踪），跳过 git 检查。
      # --provenance：生成来源证明（需 public 仓库 + id-token: write）。
      - name: Publish to npm (trusted publishing, no token)
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: pnpm publish --access public --provenance --no-git-checks --ignore-scripts
